# /etc/nginx/sites-available/myapp
# Reverse proxy: domain/IP :80  ->  127.0.0.1:8000 (container)

# Yêu cầu: biến $connection_upgrade được định nghĩa trong /etc/nginx/conf.d/connection_upgrade.conf
# (script setup.sh đã tạo sẵn; nếu chưa có, copy file nginx/connection_upgrade.conf vào đó)

server {
    listen 80;
    server_name _;               # thay bằng domain hoặc IP server, ví dụ example.com

    server_tokens off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    access_log /var/log/nginx/myapp_access.log;
    error_log  /var/log/nginx/myapp_error.log;
}
