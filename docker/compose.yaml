services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: group17-vku-task-manager:latest
    container_name: group17-app
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      NODE_ENV: production
      PORT: "8000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
