<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VKU Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 30px;
    }
    .container {
      max-width: 550px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #ddd;
    }
    h1 { color: #2563eb; }
    .form { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; min-width: 0; }
    button {
      padding: 10px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }
    .done { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VKU Task Manager</h1>
    <p>DevOps Linux Project - Group 17</p>

    <form class="form" id="taskForm">
      <input id="title" placeholder="Nhap cong viec..." required>
      <button type="submit">Them</button>
    </form>

    <ul id="taskList"></ul>
  </div>

  <script>
    const API = "/api/tasks";

    async function loadTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach(task => {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = task.title;

        if (task.completed) span.className = "done";

        const actions = document.createElement("div");

        if (!task.completed) {
          const completeBtn = document.createElement("button");
          completeBtn.textContent = "Xong";
          completeBtn.onclick = async () => {
            await fetch(`${API}/${task.id}/complete`, {
              method: "PATCH"
            });
            loadTasks();
          };
          actions.appendChild(completeBtn);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Xoa";
        deleteBtn.style.background = "#dc2626";
        deleteBtn.style.marginLeft = "5px";
        deleteBtn.onclick = async () => {
          await fetch(`${API}/${task.id}`, {
            method: "DELETE"
          });
          loadTasks();
        };

        actions.appendChild(deleteBtn);
        li.append(span, actions);
        list.appendChild(li);
      });
    }

    document.getElementById("taskForm").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");

      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: input.value })
      });

      input.value = "";
      loadTasks();
    };

    loadTasks();
  </script>
</body>
</html>
